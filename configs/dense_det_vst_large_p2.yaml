model:
  variant: small
  backbone_name: vst_large
  pretrained_backbone: false
  neck_name: cafpn_p2
  head_depth: 2
  use_detail_branch: false
  use_quality_head: true
  use_auxiliary_heads: true

data:
  format: detection
  dataset_root:
  num_classes: 6
  class_names:

train:
  epochs: 300
  patience: 20
  batch_size: 4
  image_size: 640
  num_workers: 2
  balanced_sampler: false

optimizer:
  lr: 0.0004

scheduler:
  warmup_epochs: 3
  eta_min_ratio: 0.01

augmentation:
  enabled: true
  close_after_epochs: 5
  fliplr: 0.5
  hsv_h: 0.01
  hsv_s: 0.2
  hsv_v: 0.2
  blur_prob: 0.0
  grayscale_prob: 0.0
  equalize_prob: 0.0
  erasing_prob: 0.0

loss:
  assigner: fcos
  quality: 1.5
  auxiliary: 0.25

checkpoint:
  save_dir: runs/dense_det_vst_large_p2
  save_period_batches: 200

eval:
  batch_size: 4
  during_train_every_epochs: 5
  during_train_max_batches:
  conf_thresh: 0.10
  iou_thresh: 0.50
  nms_iou: 0.60
  checkpoint_metric: map50_95
